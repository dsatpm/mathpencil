name: Deploy

# Deploy only on push to main. Pull requests must not reach production.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Authenticate to the the server via ssh
# and run our deployment script
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: "cd projects/mathpencil && ./.scripts/deploy.sh"